[package]
name = "hypr2d-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
hypr2d-client = { path = "../client" }
libc = "0.2"
cxx = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cxx-build = "1.0"
